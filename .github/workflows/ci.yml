# This action continuously checks all pushes and Pull requests
# for validity, integrity and bugs in datafiles.
# For details, visit https://github.com/BSData/check-datafiles
name: Datafile Basic Validity
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Validate datafiles
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from xml.etree import ElementTree

        datafiles = sorted(
            path
            for pattern in ("*.cat", "*.gst", "*.cattemplate")
            for path in Path(".").glob(pattern)
        )
        if not datafiles:
            raise SystemExit("No datafiles found")

        for datafile in datafiles:
            try:
                ElementTree.parse(datafile)
            except ElementTree.ParseError as error:
                raise SystemExit(f"Invalid XML in {datafile}: {error}")

        print(f"Validated {len(datafiles)} datafiles")
        PY

    - uses: actions/upload-artifact@v4
      with:
        name: artifact
        path: |
          *.cat
          *.gst
          *.cattemplate
